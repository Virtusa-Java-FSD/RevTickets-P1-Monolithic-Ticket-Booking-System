<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concert Checkout Layout</title>
    <link rel="stylesheet" href="src/styles/concert-booking.css">
</head>
<body>
    <div class="concert-booking-page">
        <!-- Booking Steps (existing) -->
        <div class="container">
            <div class="booking-steps">
                <div class="step">
                    <div class="step-number">1</div>
                    <div class="step-label">Select Seats</div>
                </div>
                <div class="step-line"></div>
                <div class="step active">
                    <div class="step-number">2</div>
                    <div class="step-label">Customer Details</div>
                </div>
                <div class="step-line"></div>
                <div class="step">
                    <div class="step-number">3</div>
                    <div class="step-label">Payment</div>
                </div>
            </div>

            <!-- Checkout Layout -->
            <div class="checkout-container">
                <!-- Left Side: Customer Details + Payment Method -->
                <div class="checkout-left">
                    <!-- Customer Details Section -->
                    <div class="customer-details-section">
                        <h3 class="section-title">Customer Details</h3>
                        <form>
                            <div class="form-row">
                                <div class="form-group">
                                    <label htmlFor="fullName">Full Name *</label>
                                    <input 
                                        type="text" 
                                        id="fullName" 
                                        placeholder="Enter your full name"
                                        required 
                                    />
                                </div>
                                <div class="form-group">
                                    <label htmlFor="email">Email Address *</label>
                                    <input 
                                        type="email" 
                                        id="email" 
                                        placeholder="your@email.com"
                                        required 
                                    />
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label htmlFor="phone">Phone Number *</label>
                                    <input 
                                        type="tel" 
                                        id="phone" 
                                        placeholder="+91 1234567890"
                                        required 
                                    />
                                </div>
                                <div class="form-group">
                                    <label htmlFor="age">Age</label>
                                    <input 
                                        type="number" 
                                        id="age" 
                                        placeholder="25"
                                        min="1" 
                                    />
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- Payment Method Section -->
                    <div class="payment-method-section">
                        <h3 class="section-title">Payment Method</h3>
                        <div class="payment-methods">
                            <div class="payment-option">
                                <input type="radio" id="card" name="payment" value="card" />
                                <div class="payment-icon card">💳</div>
                                <label htmlFor="card">
                                    <div>Credit/Debit Card</div>
                                    <div class="payment-details">Visa, Mastercard, Amex</div>
                                </label>
                            </div>
                            
                            <div class="payment-option">
                                <input type="radio" id="upi" name="payment" value="upi" checked />
                                <div class="payment-icon upi">📱</div>
                                <label htmlFor="upi">
                                    <div>UPI</div>
                                    <div class="payment-details">Google Pay, PhonePe, Paytm</div>
                                </label>
                            </div>
                            
                            <div class="payment-option">
                                <input type="radio" id="wallet" name="payment" value="wallet" />
                                <div class="payment-icon wallet">💰</div>
                                <label htmlFor="wallet">
                                    <div>Wallet</div>
                                    <div class="payment-details">Paytm, Amazon Pay</div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Side: Booking Summary -->
                <div class="checkout-right">
                    <div class="booking-summary-section">
                        <h3 class="section-title">Booking Summary</h3>
                        
                        <div class="concert-info">
                            <div class="concert-title">Adele Weekends with Adele</div>
                        </div>

                        <div class="booking-details">
                            <div class="detail-item">
                                <span class="detail-label">Date:</span>
                                <span class="detail-value">12/12/2025</span>
                            </div>
                            
                            <div class="detail-item">
                                <span class="detail-label">Time:</span>
                                <span class="detail-value">7:00 PM</span>
                            </div>
                            
                            <div class="detail-item">
                                <span class="detail-label">Seats:</span>
                                <span class="detail-value">G9, B9, B10</span>
                            </div>
                            
                            <div class="detail-item">
                                <span class="detail-label">Total Seats:</span>
                                <span class="detail-value">3</span>
                            </div>
                            
                            <div class="detail-item">
                                <span class="detail-label">Ticket Price:</span>
                                <span class="detail-value">₹2,400</span>
                            </div>
                            
                            <div class="detail-item">
                                <span class="detail-label">Convenience Fee:</span>
                                <span class="detail-value">₹120</span>
                            </div>
                            
                            <div class="detail-item">
                                <span class="detail-label">Total Amount:</span>
                                <span class="detail-value">₹2,520</span>
                            </div>
                        </div>

                        <button class="proceed-btn" style="margin-top: 1.5rem;">
                            Proceed to Payment
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
